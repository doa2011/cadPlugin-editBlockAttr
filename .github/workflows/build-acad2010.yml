name: Build and Release AutoCAD Plugin

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "选择要编译的 AutoCAD 版本"
        required: true
        type: choice
        default: all
        options:
          - all
          - "2010"
          - "2011"
          - "2012"
          - "2013"
          - "2014"
          - "2015"
          - "2016"
          - "2017"
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Autodesk AutoCAD 2024 API reference package
        shell: pwsh
        run: |
          $refDir = Join-Path $env:RUNNER_TEMP "acad-nuget-ref"
          New-Item -ItemType Directory -Force -Path $refDir | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net48</TargetFramework>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="AutoCAD.NET" Version="24.3.0" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding UTF8 (Join-Path $refDir "Ref.csproj")
          dotnet restore (Join-Path $refDir "Ref.csproj")
          if ($LASTEXITCODE -ne 0) { throw "Restore Autodesk AutoCAD.NET 24.3.0 failed" }

          python tools/prepare_nuget_refs.py "$env:USERPROFILE\.nuget\packages" "build/refs/clr4"
          if ($LASTEXITCODE -ne 0) { throw "Preparing AutoCAD API reference assemblies failed" }

      - name: Build selected AutoCAD version(s)
        shell: pwsh
        run: |
          # 清理旧产物，确保单版本构建的压缩包不会混入其他年份的 DLL。
          if (Test-Path "dist_all") {
            Remove-Item "dist_all" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "dist_all" | Out-Null

          python tools/build_all.py --year "${{ inputs.version || 'all' }}"
          if ($LASTEXITCODE -ne 0) { throw "AutoCAD build or verification failed" }

          $dlls = Get-ChildItem "dist_all" -Filter "*.dll" -File
          if ($dlls.Count -eq 0) {
            throw "No DLL files were generated"
          }

          Compress-Archive -Path $dlls.FullName -DestinationPath "dist_all/AutoCADBlockAttrPlugin-AutoCAD-${{ inputs.version || 'all' }}.zip" -Force

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.0-${{ inputs.version || 'all' }}-${{ github.run_number }}"
          name: "AutoCADBlockAttrPlugin 1.2.0 - AutoCAD ${{ inputs.version || 'all' }}"
          target_commitish: "${{ github.sha }}"
          generate_release_notes: true
          files: |
            dist_all/*.dll
            dist_all/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
